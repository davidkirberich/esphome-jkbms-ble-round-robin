substitutions:
  name: jk-bms-round-robin
  protocol_version: JK02_32S
  rr_bms:
    - client: rr_client_bms1
      online: rr_bms1_online
    - client: rr_client_bms2
      online: rr_bms2_online
  rr_cycle_s: "60"
  rr_min_dwell_s: "10"
  rr_check_interval: 5s
  rr_disconnect_timeout: 10s
  rr_handover_delay: 1s
  bms_throttle: 5s

esphome:
  name: ${name}
  friendly_name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://syssi/esphome-jk-bms@b4f711d180671143c35f9e36079f8652591c52a8

packages:
  round_robin: !include ../packages/round_robin.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO
  baud_rate: 0
  logs:
    jk_bms_ble: WARN
    sensor: WARN

api:

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bms1_mac_address
    id: rr_client_bms1
    auto_connect: false
  - mac_address: !secret bms2_mac_address
    id: rr_client_bms2
    auto_connect: false

jk_bms_ble:
  - ble_client_id: rr_client_bms1
    protocol_version: ${protocol_version}
    throttle: ${bms_throttle}
    id: rr_bms1
  - ble_client_id: rr_client_bms2
    protocol_version: ${protocol_version}
    throttle: ${bms_throttle}
    id: rr_bms2

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: rr_bms1
    online_status:
      id: rr_bms1_online
      name: "BMS 1 Online"
  - platform: jk_bms_ble
    jk_bms_ble_id: rr_bms2
    online_status:
      id: rr_bms2_online
      name: "BMS 2 Online"

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: rr_bms1
    total_voltage:
      name: "BMS 1 Total Voltage"
      filters: &retain_valid
        - filter_out: nan
      on_raw_value:
        - lambda: |-
            if (std::isfinite(x)) {
              id(rr_last_data_us)[0] = esp_timer_get_time();
            }
    current:
      name: "BMS 1 Current"
      filters: *retain_valid
    power:
      name: "BMS 1 Power"
      filters: *retain_valid
    charging_power:
      name: "BMS 1 Charging Power"
      filters: *retain_valid
    discharging_power:
      name: "BMS 1 Discharging Power"
      filters: *retain_valid
    average_cell_voltage:
      name: "BMS 1 Average Cell Voltage"
      filters: *retain_valid
    temperature_sensor_1:
      name: "BMS 1 Temperature Sensor 1"
      filters: *retain_valid
    temperature_sensor_2:
      name: "BMS 1 Temperature Sensor 2"
      filters: *retain_valid
    state_of_charge:
      name: "BMS 1 State of Charge"
      filters: *retain_valid
  - platform: jk_bms_ble
    jk_bms_ble_id: rr_bms2
    total_voltage:
      name: "BMS 2 Total Voltage"
      filters: *retain_valid
      on_raw_value:
        - lambda: |-
            if (std::isfinite(x)) {
              id(rr_last_data_us)[1] = esp_timer_get_time();
            }
    current:
      name: "BMS 2 Current"
      filters: *retain_valid
    power:
      name: "BMS 2 Power"
      filters: *retain_valid
    charging_power:
      name: "BMS 2 Charging Power"
      filters: *retain_valid
    discharging_power:
      name: "BMS 2 Discharging Power"
      filters: *retain_valid
    average_cell_voltage:
      name: "BMS 2 Average Cell Voltage"
      filters: *retain_valid
    temperature_sensor_1:
      name: "BMS 2 Temperature Sensor 1"
      filters: *retain_valid
    temperature_sensor_2:
      name: "BMS 2 Temperature Sensor 2"
      filters: *retain_valid
    state_of_charge:
      name: "BMS 2 State of Charge"
      filters: *retain_valid
  - platform: template
    name: "BMS 1 Data Age"
    unit_of_measurement: s
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: ${rr_check_interval}
    lambda: |-
      const int64_t last = id(rr_last_data_us)[0];
      return last == 0 ? NAN : (esp_timer_get_time() - last) / 1000000.0f;

  - platform: template
    name: "BMS 2 Data Age"
    unit_of_measurement: s
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: ${rr_check_interval}
    lambda: |-
      const int64_t last = id(rr_last_data_us)[1];
      return last == 0 ? NAN : (esp_timer_get_time() - last) / 1000000.0f;

text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: rr_bms1
    errors:
      name: "BMS 1 Errors"
  - platform: jk_bms_ble
    jk_bms_ble_id: rr_bms2
    errors:
      name: "BMS 2 Errors"
