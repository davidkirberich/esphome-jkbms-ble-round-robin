substitutions:
  rr_cycle_s: "60"
  rr_min_dwell_s: "10"
  rr_check_interval: 5s
  rr_disconnect_timeout: 10s
  rr_handover_delay: 1s
  rr_reset_ble_on_handover: "false"
  rr_ble_restart_timeout: 15s
  rr_ble_off_delay: 1s

esp32_ble:
  max_connections: ${len(rr_bms)}

globals:
  - id: rr_last_data_us
    type: std::vector<int64_t>
    restore_value: no
    initial_value: "std::vector<int64_t>(${len(rr_bms)}, 0)"
  - id: rr_clients
    type: std::vector<esphome::ble_client::BLEClient *>
    restore_value: no
  - id: rr_online_sensors
    type: std::vector<esphome::binary_sensor::BinarySensor *>
    restore_value: no
  - id: rr_active_index
    type: size_t
    restore_value: no
    initial_value: "0"
  - id: rr_next_index
    type: size_t
    restore_value: no
    initial_value: "0"
  - id: rr_connect_start_time
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: rr_connection_enabled
    type: bool
    restore_value: no
    initial_value: "false"
  - id: rr_suspended
    type: bool
    restore_value: no
    initial_value: "false"
  - id: rr_configuration_valid
    type: bool
    restore_value: no
    initial_value: "true"

esphome:
  min_version: 2026.9.0
  includes:
    - <esp_bt_main.h>
    - <esp_bt.h>
  on_boot:
    priority: -10
    then:
      - lambda: |-
          static_assert(${len(rr_bms)} > 0, "rr_bms must not be empty");
          static_assert(${rr_cycle_s} > 0 && ${rr_cycle_s} <= 2147483,
                        "rr_cycle_s must be between 1 and 2147483");
          static_assert(${rr_min_dwell_s} >= 0 && ${rr_min_dwell_s} <= 2147483,
                        "rr_min_dwell_s must be between 0 and 2147483");
          id(rr_clients) = {id(${rr_bms | map(attribute='client') | join('), id(')})};
          id(rr_online_sensors) = {id(${rr_bms | map(attribute='online') | join('), id(')})};
          for (size_t i = 0; i < id(rr_clients).size(); ++i) {
            for (size_t j = 0; j < i; ++j) {
              if (id(rr_clients)[i] == id(rr_clients)[j] ||
                  id(rr_online_sensors)[i] == id(rr_online_sensors)[j]) {
                ESP_LOGE("round_robin", "Duplicate client or online sensor in rr_bms; scheduler suspended");
                id(rr_configuration_valid) = false;
              }
            }
            id(rr_clients)[i]->set_enabled(false);
            id(rr_clients)[i]->set_auto_connect(true);
          }
      - script.execute: rr_switch_connection

script:
  - id: rr_switch_connection
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(rr_suspended) && id(rr_configuration_valid);"
          then:
            - lambda: |-
                id(rr_connection_enabled) = false;
                for (auto *client : id(rr_clients)) {
                  client->set_enabled(false);
                }
            - wait_until:
                condition:
                  lambda: |-
                    for (auto *client : id(rr_clients)) {
                      if (client->state() != esphome::esp32_ble_tracker::ClientState::IDLE) {
                        return false;
                      }
                    }
                    return true;
                timeout: ${rr_disconnect_timeout}
            - if:
                condition:
                  lambda: |-
                    for (auto *client : id(rr_clients)) {
                      if (client->state() != esphome::esp32_ble_tracker::ClientState::IDLE) {
                        return false;
                      }
                    }
                    return !id(rr_suspended);
                then:
                  - if:
                      condition:
                        lambda: "return ${rr_reset_ble_on_handover};"
                      then:
                        - script.execute: rr_restart_ble_stack
                        - script.wait: rr_restart_ble_stack
                  - delay: ${rr_handover_delay}
                  - lambda: |-
                      if (id(rr_suspended)) {
                        return;
                      }
                      for (auto *client : id(rr_clients)) {
                        if (client->state() != esphome::esp32_ble_tracker::ClientState::IDLE) {
                          ESP_LOGE("round_robin", "BLE client left IDLE during handover delay; retrying on next check");
                          return;
                        }
                      }
                      id(rr_active_index) = id(rr_next_index);
                      id(rr_connect_start_time) = millis();
                      id(rr_clients)[id(rr_active_index)]->set_enabled(true);
                      id(rr_connection_enabled) = true;
                      id(rr_next_index) = (id(rr_active_index) + 1) % id(rr_clients).size();
                      ESP_LOGI("round_robin", "Enabling BMS %u of %u",
                               static_cast<unsigned>(id(rr_active_index) + 1),
                               static_cast<unsigned>(id(rr_clients).size()));
                else:
                  - logger.log:
                      level: ERROR
                      tag: round_robin
                      format: "BLE disconnect timed out; all clients remain disabled, retrying on next check"

  - id: rr_restart_ble_stack
    mode: single
    then:
      - logger.log:
          tag: round_robin
          format: "Experimental handover: stopping entire BLE stack"
      - ble.disable:
      - wait_until:
          condition:
            lambda: |-
              return esp_bluedroid_get_status() == ESP_BLUEDROID_STATUS_UNINITIALIZED &&
                     esp_bt_controller_get_status() == ESP_BT_CONTROLLER_STATUS_IDLE;
          timeout: ${rr_ble_restart_timeout}
      - if:
          condition:
            lambda: |-
              return !id(rr_suspended) &&
                     esp_bluedroid_get_status() == ESP_BLUEDROID_STATUS_UNINITIALIZED &&
                     esp_bt_controller_get_status() == ESP_BT_CONTROLLER_STATUS_IDLE;
          then:
            - delay: ${rr_ble_off_delay}
            - ble.enable:
            - wait_until:
                condition:
                  lambda: |-
                    if (!esphome::esp32_ble::global_ble->is_active()) {
                      return false;
                    }
                    for (auto *client : id(rr_clients)) {
                      if (client->state() != esphome::esp32_ble_tracker::ClientState::IDLE) {
                        return false;
                      }
                    }
                    return true;
                timeout: ${rr_ble_restart_timeout}
            - if:
                condition:
                  lambda: |-
                    if (!esphome::esp32_ble::global_ble->is_active()) {
                      return false;
                    }
                    for (auto *client : id(rr_clients)) {
                      if (client->state() != esphome::esp32_ble_tracker::ClientState::IDLE) {
                        return false;
                      }
                    }
                    return true;
                then:
                  - logger.log:
                      tag: round_robin
                      format: "BLE stack restarted; all clients registered and idle"
                else:
                  - lambda: "id(rr_suspended) = true;"
                  - logger.log:
                      level: ERROR
                      tag: round_robin
                      format: "BLE restart timed out; scheduler suspended, reboot gateway to recover"
          else:
            - lambda: "id(rr_suspended) = true;"
            - logger.log:
                level: ERROR
                tag: round_robin
                format: "BLE shutdown timed out; scheduler suspended, reboot gateway to recover"

interval:
  - interval: ${rr_check_interval}
    then:
      - if:
          condition:
            and:
              - not:
                  script.is_running: rr_switch_connection
              - lambda: |-
                  if (id(rr_suspended) || !id(rr_configuration_valid) || id(rr_clients).empty()) {
                    return false;
                  }
                  if (!id(rr_connection_enabled)) {
                    return true;
                  }
                  const uint32_t elapsed = millis() - id(rr_connect_start_time);
                  if (elapsed < ${rr_cycle_s} * 1000UL) {
                    return false;
                  }
                  auto *online = id(rr_online_sensors)[id(rr_active_index)];
                  return !online->has_state() || !online->state ||
                         elapsed >= ${rr_min_dwell_s} * 1000UL;
          then:
            - script.execute: rr_switch_connection

ota:
  - platform: esphome
    on_begin:
      then:
        - lambda: "id(rr_suspended) = true;"
        - script.stop: rr_switch_connection
        - script.stop: rr_restart_ble_stack
        - lambda: |-
            id(rr_next_index) = id(rr_active_index);
            id(rr_connection_enabled) = false;
            for (auto *client : id(rr_clients)) {
              client->set_enabled(false);
            }
        - logger.log: "BLE round robin suspended for OTA update"
    on_error:
      then:
        - lambda: "id(rr_suspended) = false;"
        - logger.log:
            level: WARN
            tag: round_robin
            format: "OTA failed; BLE round robin will resume on next check"
